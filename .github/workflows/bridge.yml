name: Token bridge

# Tests the bridge on every change to it, and on a `bridge-v*` tag publishes
# a GitHub release with a binary for each platform:
#
#   git tag bridge-v0.1.0 && git push origin bridge-v0.1.0
#
# The bridge calls PKCS#11 modules without cgo, so one Linux runner builds
# every binary.

on:
  # No path filter here: on a push, GitHub requires tags and paths to match
  # together, and a release tag must always run.
  push:
    branches: [main]
    tags: ['bridge-v*']
  pull_request:
    paths: ['bridge/**', '.github/workflows/bridge.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: bridge

jobs:
  test:
    name: Test against SoftHSM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - run: go vet ./... && GOOS=windows go vet ./...

      # A software token with an RSA and an EC key, each beside its certificate,
      # the way a signing token holds them.
      - name: Set up a SoftHSM token
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq softhsm2 opensc
          echo "directories.tokendir = $RUNNER_TEMP/tokens" > "$RUNNER_TEMP/softhsm2.conf"
          mkdir "$RUNNER_TEMP/tokens"
          echo "SOFTHSM2_CONF=$RUNNER_TEMP/softhsm2.conf" >> "$GITHUB_ENV"
          export SOFTHSM2_CONF="$RUNNER_TEMP/softhsm2.conf"
          module=/usr/lib/softhsm/libsofthsm2.so
          softhsm2-util --init-token --free --label test --pin 1234 --so-pin 5678
          cd "$RUNNER_TEMP"
          openssl req -x509 -newkey rsa:2048 -nodes -subj /CN=RSA -keyout r.pem -out r.crt
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -subj /CN=EC -keyout e.pem -out e.crt
          for k in r:01 e:02; do
            n=${k%%:*}; id=${k##*:}
            openssl pkey -in $n.pem -outform DER -out $n.der
            openssl x509 -in $n.crt -outform DER -out $n.crt.der
            pkcs11-tool --module $module --login --pin 1234 --write-object $n.der --type privkey --id $id
            pkcs11-tool --module $module --login --pin 1234 --write-object $n.crt.der --type cert --id $id
          done
          echo "PKCS11_MODULE=$module" >> "$GITHUB_ENV"

      - run: CGO_ENABLED=0 go test -count=1 -v ./...

  release:
    name: Build and release
    needs: test
    if: startsWith(github.ref, 'refs/tags/bridge-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - name: Build
        run: |
          version="${GITHUB_REF_NAME#bridge-v}"
          mkdir -p dist
          for target in windows/amd64 windows/arm64 darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="ivx-docs-bridge_${version}_${os}_${arch}"
            exe=ivx-docs-bridge; [ "$os" = windows ] && exe=ivx-docs-bridge.exe
            mkdir "$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$version" -o "$name/$exe" .
            cp README.md ../LICENSE "$name/"
            if [ "$os" = windows ]; then zip -qr "dist/$name.zip" "$name"; else tar -czf "dist/$name.tar.gz" "$name"; fi
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Token bridge ${GITHUB_REF_NAME#bridge-v}" \
            --notes "The local bridge that lets [ivx/docs Sign](https://docs.ivx.run/sign/) sign with smart cards and USB tokens. Download the file for your system, unpack it and run \`ivx-docs-bridge\`; see README.md inside for details."
